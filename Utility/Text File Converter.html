<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<style>
		#fileContents {
			width: 90vw;
			height: 50vh;
			border: 5px solid var(--border);
			font-size: 12px;
			line-height: 1.5em;
			padding: 15px;
			padding-left: 15px;
			background: none;
			overflow-y: scroll;
		}
	</style>
	<title>Lightweb: Text File Converter</title>
</head>
<body>
	<h1>Text File Converter</h1>
		<h2>Input File</h2>
			<input type="file" accept=".txt, .html, .css, .js, .bat, .cmd, .csv, .json" id="input"><br>
			<p>Converting to: 
			<select id="convertType">
				<option value="application/x-bat">.bat (Batch)</option>
				<option value="text/cmd">.cmd (Command)</option>
				<option value="text/css">.css (Cascading Style Sheets)</option>
				<option value="text/csv">.csv (Comma-Spaced Variables)</option>
				<option value="text/html">.html (HyperText Markup Langauge)</option>
				<option value="text/javascript">.js (Javascript)</option>
				<option value="application/json">.json (Javascript Object Notation)</option>
				<option value="text">.txt (Text)</option>
			</select>
			</p>
		<h2>File Contents</h2>
		<div style="display: flex; justify-content: center; margin: 60px;">
			<textarea spellcheck="false" id="fileContents"></textarea>
		</div>
		<button id="convertButton">Convert</button>
	<h2>
	<button style="font-size: 25px;"onClick="exit()">Exit</button>
	
	
	
	<script>
		function exit(){
			document.location = "../MainPages/Utility.html"
		}
	</script>
	<script src="../Important/DigitalClock.js"></script>
	<script src="Text%20File%20Converter.js"></script>
</body>
</html>
